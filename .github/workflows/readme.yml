name: Update README App List

on:
  workflow_run:
    workflows: ["Excavator"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 2

      - name: Check if manifests actually updated
        id: check_update
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if ! git diff-tree --no-commit-id --name-only -r HEAD | grep -q '^bucket/'; then
              echo "No software manifests were updated. Skipping README update."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Run Update Script
        if: steps.check_update.outputs.skip != 'true'
        run: python3 .github/scripts/update_readme.py

      - name: Commit and Push if changed
        if: steps.check_update.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update application list in README" && git push)
