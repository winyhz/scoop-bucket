- name: Generate App List via github-script
        uses: actions/github-script@main
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const bucketDir = path.join(process.env.GITHUB_WORKSPACE, 'bucket');
            const files = fs.readdirSync(bucketDir).filter(f => f.endsWith('.json')).sort();

            const rows = files.map(file => {
              const name = path.basename(file, '.json');
              const data = JSON.parse(fs.readFileSync(path.join(bucketDir, file), 'utf8'));
              const homepage = data.homepage || '#';
              const version = data.version || 'N/A';
              const desc = (data.description || 'No description provided.').replace(/\|/g, '-');
              const lic = (typeof data.license === 'object' ? data.license?.identifier : data.license) || 'Unknown';
              return `| [${name}](${homepage}) | \`${version}\` | ${desc} | ${lic} |`;
            });

            const table = ['| Application | Version | Description | License |', '| :--- | :--- | :--- | :--- |', ...rows].join('\n');
            const readmePath = path.join(process.env.GITHUB_WORKSPACE, 'README.md');
            let content = fs.readFileSync(readmePath, 'utf8');
            content = content.replace(/<!-- APPLIST:START -->[\s\S]*?<!-- APPLIST:END -->/, `<!-- APPLIST:START -->\n${table}\n<!-- APPLIST:END -->`);
            fs.writeFileSync(readmePath, content, 'utf8');
