name: Update README App List

on:
  push:
    paths:
      - 'bucket/**'
      - '.github/workflows/readme.yml'
  workflow_run:
    workflows: ["Excavator"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Generate App List via github-script
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // 1. 读取 bucket 目录
            const bucketDir = path.join(process.env.GITHUB_WORKSPACE, 'bucket');
            if (!fs.existsSync(bucketDir)) {
              console.log('No bucket directory found.');
              return;
            }

            const files = fs.readdirSync(bucketDir).filter(f => f.endsWith('.json')).sort();

            // 2. 提取每个清单的字段拼装 Markdown 行
            const rows = files.map(file => {
              const name = path.basename(file, '.json');
              const data = JSON.parse(fs.readFileSync(path.join(bucketDir, file), 'utf8'));
              const homepage = data.homepage || '#';
              const version = data.version || 'N/A';
              const desc = (data.description || 'No description provided.').replace(/\|/g, '-');
              const lic = (typeof data.license === 'object' ? data.license?.identifier : data.license) || 'Unknown';
              return `| [${name}](${homepage}) | \`${version}\` | ${desc} | ${lic} |`;
            });

            // 3. 构造表格并替换 README.md 中的占位内容
            const table = [
              '| Application | Version | Description | License |',
              '| :--- | :--- | :--- | :--- |',
              ...rows
            ].join('\n');

            const readmePath = path.join(process.env.GITHUB_WORKSPACE, 'README.md');
            let content = fs.readFileSync(readmePath, 'utf8');
            content = content.replace(/<!-- APPLIST:START -->[\s\S]*?<!-- APPLIST:END -->/, `<!-- APPLIST:START -->\n${table}\n<!-- APPLIST:END -->`);
            fs.writeFileSync(readmePath, content, 'utf8');
            console.log(`Successfully updated README.md with ${files.length} applications.`);

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update application list in README" && git push)
